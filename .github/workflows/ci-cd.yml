name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: razor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Backend Typecheck
        run: npm run typecheck --workspace=packages/backend

      - name: Frontend Typecheck
        run: npm run typecheck --workspace=packages/frontend

      - name: Initialize CI Test Database Schema
        run: npm run db:migrate --workspace=packages/backend
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/razor_test
          FRONTEND_URL: http://localhost:5173
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_TEST_KEY_ID || 'rzp_test_placeholder' }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_TEST_KEY_SECRET || 'test_key_secret_placeholder' }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_TEST_WEBHOOK_SECRET || 'test_webhook_secret' }}
          GROQ_API_KEY: ${{ secrets.GROQ_TEST_API_KEY || 'gsk_placeholder' }}
          JWT_SECRET: ${{ secrets.JWT_TEST_SECRET || 'ci_test_jwt_secret_for_validation_only' }}
          EMAIL_DELIVERY_MODE: mock
          AI_MODE: mock

      - name: Run Backend Test Suite (Isolated Unit & Integration Tests)
        run: npm run test:unit --workspace=packages/backend
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/razor_test
          FRONTEND_URL: http://localhost:5173
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_TEST_KEY_ID || 'rzp_test_placeholder' }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_TEST_KEY_SECRET || 'test_key_secret_placeholder' }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_TEST_WEBHOOK_SECRET || 'test_webhook_secret' }}
          GROQ_API_KEY: ${{ secrets.GROQ_TEST_API_KEY || 'gsk_placeholder' }}
          JWT_SECRET: ${{ secrets.JWT_TEST_SECRET || 'ci_test_jwt_secret_for_validation_only' }}
          EMAIL_DELIVERY_MODE: mock
          AI_MODE: mock

      - name: Build Production Workspace Bundles
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Frontend Production Bundle
        run: |
          echo "Verifying production frontend bundle contains no local API endpoints..."
          if grep -rn "localhost:3000" packages/frontend/dist > /dev/null; then
            echo "ERROR: Found hardcoded 'localhost:3000' in production build!"
            exit 1
          fi
          if grep -rn "localhost:7070" packages/frontend/dist > /dev/null; then
            echo "ERROR: Found hardcoded 'localhost:7070' in production build!"
            exit 1
          fi
          if grep -rn "127.0.0.1:7070" packages/frontend/dist > /dev/null; then
            echo "ERROR: Found hardcoded '127.0.0.1:7070' in production build!"
            exit 1
          fi
          if grep -rn "localhost" packages/frontend/dist > /dev/null; then
            echo "ERROR: Found 'localhost' in production build!"
            exit 1
          fi
          echo "✓ Frontend bundle verified: pure same-origin /api paths."

  deploy:
    name: Continuous Deployment
    needs: ci
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Execute EC2 Deployment & RDS Migration via AWS SSM
        run: |
          echo "Triggering production deployment on EC2 via AWS SSM..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Automated production deployment & RDS migration for Razor" \
            --parameters 'commands=["bash /home/ubuntu/razor/scripts/deploy-production.sh"]' \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Command sent successfully with Command ID: $COMMAND_ID"
          echo "Waiting for deployment execution to complete..."
          
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}"
          
          STATUS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details \
            --query "CommandInvocations[0].Status" \
            --output text)
          
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status: $STATUS"
            aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query "CommandInvocations[0].CommandPlugins[0].Output" \
              --output text
            exit 1
          fi
          
          echo "Production deployment and RDS database migration completed successfully."
